[project]
name = "langgraph-chinese-demo"
version = "0.1.0"
description = "面向中文学习者的 LangGraph 0.3.34 完整示例项目"
authors = [{ name = "LangGraph Learner", email = "learner@example.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph==0.3.34",
    "langgraph-checkpoint==2.1.0",
    "langgraph-prebuilt==0.1.8",
    "langchain-core==0.3.66",
    "langchain-openai==0.3.25",
    "langsmith==0.4.2",
    "python-dotenv==1.1.1",
    "pydantic==2.11.7",
    # 0.1.4 是最后一个兼容本项目 langgraph-checkpoint 2.x 的 MongoDB saver；
    # 0.2+ 已升级到 checkpoint 3.x，不能与本教学项目的固定版本混用。
    "langgraph-checkpoint-mongodb==0.1.4",
    "langchain-mongodb==0.6.1",
    "pymongo==4.12.1",
    # motor 3.7.x 才支持当前固定的 PyMongo 4.12.x。
    "motor==3.7.1",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
langgraph-demo = "langgraph_demo.cli:main"

[tool.poetry]
# 同时打包原有示例和本次新增的数据中台学习包，确保 pip install -e . 后可直接启动。
packages = [
    { include = "langgraph_demo", from = "src" },
    { include = "data_platform", from = "src" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
